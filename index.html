<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
  body {
    background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80') no-repeat center center fixed;
    background-size: cover;
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  .chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 15px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 80%;
    padding: 10px 14px;
    border-radius: 15px;
    font-size: 14px;
    line-height: 1.4;
    word-wrap: break-word;
  }
  .user {
    align-self: flex-start;
    background: #0084ff;
    color: white;
    border-bottom-right-radius: 2px;
  }
  .ai {
    align-self: flex-end;
    background: rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(10px);
    color: white;
    border-bottom-left-radius: 2px;
  }
  .input-area {
    display: flex;
    padding: 10px;
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(5px);
    gap: 8px;
  }
  input {
    flex: 1;
    padding: 12px;
    border: none;
    border-radius: 20px;
    outline: none;
    background: rgba(255, 255, 255, 0.9);
    font-size: 14px;
  }
  button {
    background: #25d366;
    border: none;
    color: white;
    padding: 0 18px;
    border-radius: 20px;
    font-weight: bold;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="chat-box" id="chatBox">
  <div class="msg ai">أهلاً بك! المساعد جاهز، اكتب رسالتك...</div>
</div>

<div class="input-area">
  <input type="text" id="userInput" placeholder="اكتب رسالتك هنا..." autofocus>
  <button onclick="sendMsg()">إرسال</button>
</div>

<script>
  function sendMsg() {
    var input = document.getElementById("userInput");
    var text = input.value.trim();
    if (!text) return;

    // إضافة رسالة المستخدم للشاشة
    appendMsg(text, 'user');
    input.value = '';

    // إرسال النص لـ Tasker لتشغيل الـ HTTP Request
    performTaskerAction(text);
  }

  function appendMsg(text, type) {
    var box = document.getElementById("chatBox");
    var div = document.createElement("div");
    div.className = "msg " + type;
    div.innerText = text;
    box.appendChild(div);
    box.scrollTop = box.scrollHeight;
  }

  function performTaskerAction(msg) {
    // إرسال المتغير لـ Tasker
    if (window.tasker) {
      tasker.postTask("Send_AI_Query", msg);
    }
  }

  // دالة يستدعيها Tasker لإضافة رد الذكاء الاصطناعي
  function receiveAIReply(replyText) {
    appendMsg(replyText, 'ai');
  }
</script>

</body>
</html>
